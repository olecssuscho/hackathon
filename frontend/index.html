<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пам'ятки Полтави — туман війни</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <section class="map" id="map">
      <!-- Тут буде карта (картинка або тайли) -->
      <canvas id="fog"></canvas>
    </section>

    <aside class="panel">
      <h1>Пам'ятки Полтави</h1>
      <p id="status">Відкрито: 0 із 0</p>
      <ul id="landmarks">
        <!-- Список знайдених пам'яток -->
      </ul>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
