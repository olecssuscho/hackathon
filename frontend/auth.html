<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вхід — Пам'ятки Полтави</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="card">
    <h1>Пам'ятки Полтави</h1>

    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-mode="login">Вхід</button>
      <button type="button" class="tab" data-mode="register">Реєстрація</button>
    </div>

    <form id="auth-form" novalidate>
      <label for="username">Email</label>
      <input id="username" name="username" type="email" autocomplete="email" required>

      <div id="fullname-block" hidden>
        <label for="fullname">Повне ім'я</label>
        <input id="fullname" name="fullname" autocomplete="name">
      </div>

      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <div id="confirm-block" hidden>
        <label for="confirm">Повторіть пароль</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password">
      </div>

      <p id="message" role="alert"></p>
      <button type="submit" id="submit">Увійти</button>
    </form>
  </main>

  <script src="auth.js"></script>
</body>
</html>
